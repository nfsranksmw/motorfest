<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; style-src * 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Settings & Tuneo | BSKR Motorfest</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .tunerfest-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .tunerfest-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #ffe600;
            margin-bottom: 10px;
        }
        /* Contenedor centrado con ancho máximo elegante */
        #categories-view {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
        }
        @media(max-width: 1024px) {
            .categories-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media(max-width: 768px) {
            .categories-grid { grid-template-columns: 1fr; }
        }
        .category-card {
            background: #111827;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .category-card:hover {
            border-color: #ffe600;
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 230, 0, 0.15);
            background: #161f33;
        }
        .category-content-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .category-icon {
            width: 36px;
            height: 36px;
            background: #1f293d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .category-info h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 2px;
        }
        .category-models {
            font-size: 11px;
            color: #9ca3af;
        }

        /* Contenedor principal de la vista de detalles centrado (Estilo Tune Fest) */
        #category-details-view {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Contenedor de tarjetas verticales de pro settings centrado */
        #setups-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
        }

        /* Tarjeta vertical de Pro Setting con ancho controlado y centrada */
        .prosetup-card {
            background: #111827;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 0;
        }

        .prosetup-grid-top {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 25px;
        }
        @media(max-width: 768px) {
            .prosetup-grid-top { grid-template-columns: 1fr; }
        }
        .section-box {
            background: #0b0f19;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
        }
        .section-box h4 {
            font-family: 'Orbitron', sans-serif;
            color: #ffe600;
            font-size: 13px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .slider-bar {
            flex-grow: 1;
            margin: 0 15px;
            height: 4px;
            background: #374151;
            position: relative;
            border-radius: 2px;
        }
        .slider-dot {
            width: 12px;
            height: 12px;
            background: #fff;
            border: 2px solid #ffe600;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="bg-motorfest text-white">

    <!-- Navegación -->
    <header class="navbar">
        <div class="logo">B<span>SKR</span></div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="expediente.html">Récords</a>
            <a href="miembros.html">Miembros</a>
            <a href="tuneo.html">ProSetting</a>
            <a href="grand-race.html" class="active">Grand Race</a>
            <a href="ingreso.html" class="btn-login">Acceso/Perfil</a>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="main-container">
        
        <div class="tunerfest-header">
            <h2>BSKR Pro Settings</h2>
            <p style="color: #9ca3af;">Encuentra y comparte las configuraciones mecánicas exactas de los mejores pilotos del clan.</p>
        </div>

        <!-- VISTA 1: CATEGORÍAS COMPLETAS -->
        <div id="categories-view">
            <h3 style="font-family: 'Orbitron', sans-serif; color: #ffe600; font-size: 1.2rem; margin-bottom: 20px;">Categorías Oficiales</h3>
            <div id="categories-grid" class="categories-grid">
                <!-- Se inyectarán dinámicamente con las categorías completas -->
            </div>
        </div>

        <!-- VISTA 2: LISTADO DE SETUPS DE LA CATEGORÍA SELECCIONADA -->
        <div id="category-details-view" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h3 id="selected-category-title" style="font-family: 'Orbitron', sans-serif; color: #ffe600; font-size: 1.5rem;">Categoría</h3>
                <button id="btn-back-categories" class="btn-secondary" style="padding: 6px 15px; font-size: 12px;">← Volver a Categorías</button>
            </div>
            
            <div id="setups-container">
                <!-- Tarjetas de Pro Settings detalladas -->
            </div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Clan BSKR - The Crew Motorfest. Todos los derechos reservados.</p>
    </footer>

    <script type="module" src="js/prosetting.js"></script>
</body>
</html>
